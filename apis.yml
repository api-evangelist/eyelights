aid: eyelights
name: EyeLights
description: >-
  EyeLights is a French deep-tech company building augmented reality head-up
  display (HUD) technology for riders and pilots. Its products project GPS
  navigation, speed, intercom, radar and call information into the rider's line
  of sight: EyeRide, a universal HUD accessory compatible with any motorcycle
  helmet; the GT-AIR 3 Smart, an integrated head-up display visor built into a
  SHOEI helmet; the APEX HUD glasses for general aviation; and Pulse Ultra, a
  universal Bluetooth intercom. The company sells direct-to-consumer through a
  Shopify storefront at eye-lights.com and runs customer support on Odoo. This
  profile was added to the API Evangelist network as a Techstars portfolio lead;
  EyeLights publishes no public developer API, SDK, or documentation surface at
  this time, so this record captures its consumer web, identity, and security
  posture rather than an API contract.
